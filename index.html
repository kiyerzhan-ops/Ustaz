<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ustaz — уроки с безопасной оплатой</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#161a22;--mute:#6b7280;--line:#e5e7eb;--acc:#3a4bd6;--accs:#eceefc;--ok:#0f8a5f;--star:#f5a524;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b23;--ink:#eef0f4;--mute:#9aa3b2;--line:#262c38;--acc:#8b98ff;--accs:#20264a;--ok:#3ecf99}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b23;--ink:#eef0f4;--mute:#9aa3b2;--line:#262c38;--acc:#8b98ff;--accs:#20264a;--ok:#3ecf99}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:60px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-left:4px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button,.lg button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--mute);font-weight:500;white-space:nowrap;transition:.2s}
nav button:hover,.lg button:hover{color:var(--ink)}
nav button.on,.lg button.on{background:var(--accs);color:var(--acc);font-weight:700}
.lg{display:flex}
@media(max-width:760px){.bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:6px}nav{order:3;width:100%}}
h1{font-size:clamp(30px,5vw,50px);line-height:1.1;letter-spacing:-.03em;margin:56px 0 14px;max-width:16em;font-weight:800}
.sub{color:var(--mute);max-width:36em;margin:0 0 32px;font-size:18px}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:999px;font-weight:500;transition:.2s}
.chip:hover{border-color:var(--acc)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:24px;align-items:end;margin-bottom:28px}
.filters label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute);font-weight:500}
select,textarea,input[type=text],input[type=tel],input[type=email],input[type=number]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:170px}
input[type=range]{accent-color:var(--acc);width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.card h3{margin:0;font-size:18px;letter-spacing:-.01em;line-height:1.3}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.av.big{width:72px;height:72px;font-size:24px}
.mute{color:var(--mute);font-size:14px}.st{color:var(--star);letter-spacing:1px}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--accs);color:var(--acc);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.price{font-weight:800;font-size:20px}
.btn{border:0;background:var(--acc);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;transition:.2s}
.btn:hover{filter:brightness(1.1)}.btn.g{background:var(--accs);color:var(--acc)}.btn.bad{background:none;border:1px solid var(--line);color:var(--ink)}
.empty{grid-column:1/-1;padding:48px 0;color:var(--mute);text-align:center}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding-bottom:32px}
.safe{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:64px;color:var(--mute)}
#m{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.55);display:none;align-items:center;justify-content:center;padding:16px}
#m.on{display:flex}
.md{background:var(--card);border-radius:20px;max-width:560px;width:100%;max-height:92%;overflow:auto;padding:26px;position:relative;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:26px;color:var(--mute)}
.vid{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,var(--accs),var(--line));display:grid;place-items:center;position:relative;margin:14px 0}
.vid b{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:20px;padding-left:4px}
.vid span{position:absolute;right:10px;bottom:8px;font-size:12px;background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:6px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:14px;color:var(--mute);font-weight:500}
.f input,.f textarea,.f select{width:100%}textarea{resize:vertical;min-height:84px}.chip input{margin-right:6px;accent-color:var(--acc)}.f.bad input{border-color:#e5484d}
.rs{display:flex;gap:4px;font-size:38px}.rs button{border:0;background:none;color:var(--line);padding:0;transition:.15s}.rs button.on{color:var(--star)}
.ok{color:var(--ok);font-weight:700}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mute);text-align:center;font-size:14px}
footer b{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="w bar">
<div class="logo">Ustaz<i></i></div>
<nav id="nav"></nav>
<div class="lg" id="lg"></div>
</div></header>
<main class="w" id="app"></main>
<footer><div class="w"><div id="dev"></div><div style="margin-top:6px"><b>Сыдық Нұрғиса</b> · <b>Калыбай Ержан</b> · <b>Уалихан Қожа</b></div></div></footer>
<div id="m" role="dialog" aria-modal="true"><div class="md" id="md"></div></div>

/* ===== КҮН / ТҮН РЕЖИМІ ===== */
#themeToggle{border:1px solid var(--line);background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;cursor:pointer;transition:transform .25s,background .25s,border-color .25s;flex:none}
#themeToggle:hover{transform:rotate(12deg) scale(1.05);border-color:var(--acc)}
#nightSky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .6s ease;background:radial-gradient(circle at 78% 18%,rgba(130,150,255,.10),transparent 25%),linear-gradient(180deg,#080d20 0%,#10172e 55%,#0b1020 100%)}
:root[data-theme="dark"] #nightSky{opacity:1}
.moon{position:absolute;width:92px;height:92px;right:8%;top:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#e9edff 55%,#bfc9ef 100%);box-shadow:0 0 25px rgba(220,230,255,.55),0 0 70px rgba(140,160,255,.25);animation:moonFloat 7s ease-in-out infinite}
.moon:after{content:"";position:absolute;width:92px;height:92px;border-radius:50%;left:-24px;top:-8px;background:#0b1020}
.stars{position:absolute;inset:0}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 7px rgba(255,255,255,.9);animation:twinkle var(--d) ease-in-out infinite}
.shooting-star{position:absolute;width:110px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:0;transform:rotate(-25deg);filter:drop-shadow(0 0 5px #fff)}
.shooting-star.s1{top:18%;left:72%;animation:shoot 6s linear infinite 1s}.shooting-star.s2{top:34%;left:84%;animation:shoot 8s linear infinite 4s}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

async function createTok(){
 const er=$('#er');er.textContent='';
 if(!W||!P){er.textContent=t('wneed');return}
 if(!window.solanaWeb3){er.textContent=t('wnet');return}
 try{
  const S=solanaWeb3,conn=new S.Connection(RPC,'confirmed'),me=PKb(W.a),mk=S.Keypair.generate(),d=6;
  const lam=await conn.getMinimumBalanceForRentExemption(82);
  const init=new Uint8Array(67);init[0]=0;init[1]=d;init.set(me.toBytes(),2);init[34]=1;init.set(me.toBytes(),35);
  const mt=new Uint8Array(9);mt[0]=7;new DataView(mt.buffer).setBigUint64(1,100000n*10n**BigInt(d),true);
  const m=mk.publicKey.toBase58(),a=ata(W.a,m);
  const {blockhash,lastValidBlockHeight}=await conn.getLatestBlockhash();
  const tx=new S.Transaction({feePayer:me,blockhash,lastValidBlockHeight}).add(
   S.SystemProgram.createAccount({fromPubkey:me,newAccountPubkey:mk.publicKey,lamports:lam,space:82,programId:PKb(TP)}),
   new S.TransactionInstruction({programId:PKb(TP),keys:[{pubkey:mk.publicKey,isSigner:false,isWritable:true},{pubkey:S.SYSVAR_RENT_PUBKEY,isSigner:false,isWritable:false}],data:init}),
   mkAta(W.a,W.a,m),
   new S.TransactionInstruction({programId:PKb(TP),keys:[{pubkey:mk.publicKey,isSigner:false,isWritable:true},{pubkey:a,isSigner:false,isWritable:true},{pubkey:me,isSigner:true,isWritable:false}],data:mt}));
  tx.partialSign(mk);
  const signed=await P.signTransaction(tx),sig=await conn.sendRawTransaction(signed.serialize());
  await conn.confirmTransaction({signature:sig,blockhash,lastValidBlockHeight},'confirmed');
  TOK={m,d};sv('tok',TOK);const i=$('#tm');if(i)i.value=m;chk();
 }catch(e){console.error(e);er.textContent=errM(e)}
}

 <p class="mute" style="margin:0"><b style="color:var(--ink)">${t('exp')}:</b> ${x.y} ${t('yrs')}<br><b style="color:var(--ink)">${t('edu')}:</b> ${esc(x.e)}</p>
 <p style="margin:12px 0 6px"><b>${t('sk')}</b></p><div class="tags">${x.s.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>${tags(x.l)}
 <p style="margin:18px 0 8px"><b>${t('courses')}</b></p>${C.filter(c=>c.t===id).map(c=>`<button class="card" style="width:100%;margin-bottom:8px;padding:14px" onclick="openC(${c.id})"><b>${esc(c.n[IDX[lang]])}</b><span class="mute">${money(c.p)} · 60 ${t('min')}</span></button>`).join('')}`)}

function openP(id){if(!U){closeM();go('a');return}pm='card';const c=crs(id);showM(`<h2>${t('pay')}</h2><p class="mute" style="margin-top:0">${esc(c.n[IDX[lang]])} — <b style="color:var(--ink)">${money(c.p)}</b></p>
 <div class="row" style="margin-bottom:14px"><button class="chip pmb on" data-m="card" onclick="setPM('card')">${t('cardm')}</button><button class="chip pmb" data-m="sol" onclick="setPM('sol')">◎ Solana</button><button class="chip pmb" data-m="tok" onclick="setPM('tok')">🪙 Token</button></div>
 <div class="f" id="f1"><label for="i1">${t('fio')}</label><input id="i1" type="text" autocomplete="name" placeholder="Иванов Иван Иванович"></div>
 <div class="f" id="f2"><label for="i2">${t('ph')}</label><input id="i2" type="tel" autocomplete="tel" placeholder="+7 701 123 45 67"></div>
 <div class="f" id="f3"><label for="i3">Gmail</label><input id="i3" type="email" autocomplete="email" placeholder="name@gmail.com"></div>
 <div class="f" id="f4"><label for="i4">${t('card')}</label><input id="i4" type="text" inputmode="numeric" autocomplete="off" maxlength="19" placeholder="0000 0000 0000 0000" oninput="this.value=this.value.replace(/\\D/g,'').replace(/(.{4})/g,'$1 ').trim()"></div>
 <div class="card" id="sol" style="display:none;margin-bottom:14px;gap:8px"><div id="wl" class="mute">${wtxt()}</div><div class="row" style="flex-wrap:wrap"><button class="btn g" onclick="conW('phantom')">👻 Phantom</button><button class="btn g" onclick="conW('solflare')">🔆 Solflare</button></div><div class="mute" id="tk" style="font-size:13px;display:none">🪙 ≈ <b style="color:var(--ink)">${Math.ceil(c.p/RATE)}</b> ${t('tokw')} · ${t('trate')}<br>${TOK?TOK.m.slice(0,6)+'…'+TOK.m.slice(-6):t('tknone')}</div><div class="mute" id="ls" style="font-size:13px">≈ <b style="color:var(--ink)">${solAmt(c.p)} SOL</b> · ${t('wrate')}<br>${t('wesc')}: ${PLATFORM.slice(0,6)}…${PLATFORM.slice(-6)} · <a href="https://faucet.solana.com" target="_blank" rel="noopener">${t('wfc')}</a></div></div>
 <div class="mute" id="er" style="color:#e5484d;min-height:22px"></div>
 <p class="mute" style="font-size:13px">🔒 ${t('sn')} ${t('fee')}.</p>
 <button class="btn" style="width:100%" id="pb2" onclick="pay(${id})">${t('pb')} ${money(c.p)}</button>`)}

let pm='card',W=null;
let TOK=ld('tok',null);
const TP='TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA',AP='ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL',RATE=100;
const TW='3Rac7dueBBndkqfxZxGxMMHWDPLi9hZ2KvsWETKhFaaN',TWL={ru:'Кошелёк преподавателя',kk:'Оқытушы әмияны',en:'Teacher wallet'},PLATFORM='8zdZfJ4DLyiaNmV55biNC3NoXpZKNjM4zta2r1wwK1WT',RPC='https://api.devnet.solana.com';
// DEVNET DEMO: TW is the wallet that receives the teacher payout. It may be your own test wallet.
const DEMO_TEACHER_WALLET=TW;
const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const rb=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>B58[b%58]).join('');
const solAmt=p=>(p/80000).toFixed(4);
function setPM(m){pm=m;$('#f4').style.display=m==='card'?'':'none';$('#sol').style.display=m==='card'?'none':'';$('#ls').style.display=m==='sol'?'':'none';$('#tk').style.display=m==='tok'?'':'none';document.querySelectorAll('.pmb').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
let P=null;
const NM={phantom:'Phantom',solflare:'Solflare'},LK={phantom:'https://phantom.com/download',solflare:'https://solflare.com/download'};
const getP=k=>k==='phantom'?(window.phantom&&window.phantom.solana&&window.phantom.solana.isPhantom?window.phantom.solana:window.solana&&window.solana.isPhantom?window.solana:null):(window.solflare&&window.solflare.isSolflare?window.solflare:null);
const wtxt=b=>W?`<span class="ok">✓ ${NM[W.k]} ${W.a.slice(0,4)}…${W.a.slice(-4)}</span>${b!=null?' · '+t('wbal')+': '+b+' SOL':''} <button class="chip" style="padding:2px 10px" onclick="disW()">${t('wdis')}</button>`:t('wn');
const showW=b=>{const w=$('#wl');if(w)w.innerHTML=wtxt(b)};
async function conW(k){
 const er=$('#er');if(er)er.textContent='';
 const p=getP(k);
 if(!p){if(er)er.innerHTML=NM[k]+' '+t('nw')+` <a href="${LK[k]}" target="_blank" rel="noopener">${LK[k].replace('https://','')}</a>`;return}
 try{const r=await p.connect(),pk=(r&&r.publicKey)||p.publicKey;W={a:pk.toString(),real:1,k};P=p}catch(e){if(er)er.textContent=t('wrej');return}
 showW();
 if(window.solanaWeb3){try{showW(((await new solanaWeb3.Connection(RPC,'confirmed').getBalance(new solanaWeb3.PublicKey(W.a)))/1e9).toFixed(3))}catch(e){}}
}
async function disW(){try{await P.disconnect()}catch(e){}W=null;P=null;showW();if(view==='d')chk()}
const PKb=a=>new solanaWeb3.PublicKey(a);
const ata=(o,m)=>solanaWeb3.PublicKey.findProgramAddressSync([PKb(o).toBytes(),PKb(TP).toBytes(),PKb(m).toBytes()],PKb(AP))[0];
const mkAta=(pay,own,m)=>new solanaWeb3.TransactionInstruction({programId:PKb(AP),keys:[[pay,1,1],[ata(own,m),0,1],[own,0,0],[m,0,0],[solanaWeb3.SystemProgram.programId.toBase58(),0,0],[TP,0,0]].map(([k,sg,w])=>({pubkey:PKb(k),isSigner:!!sg,isWritable:!!w})),data:new Uint8Array([1])});
const mkTc=(src,m,dst,auth,u,d)=>{const b=new Uint8Array(10);b[0]=12;new DataView(b.buffer).setBigUint64(1,u,true);b[9]=d;return new solanaWeb3.TransactionInstruction({programId:PKb(TP),keys:[[src,0,1],[m,0,0],[dst,0,1],[auth,1,0]].map(([k,sg,w])=>({pubkey:PKb(k),isSigner:!!sg,isWritable:!!w})),data:b})};
async function sendTok(n){
 const S=solanaWeb3,conn=new S.Connection(RPC,'confirmed'),m=TOK.m,d=TOK.d,u=BigInt(n)*10n**BigInt(d),src=ata(W.a,m).toBase58();
 let bal=0n;try{bal=BigInt((await conn.getTokenAccountBalance(PKb(src))).value.amount)}catch(e){}
 if(bal<u)throw new Error('lowt');
 const {blockhash,lastValidBlockHeight}=await conn.getLatestBlockhash();
 const tx=new S.Transaction({feePayer:PKb(W.a),blockhash,lastValidBlockHeight}).add(mkAta(W.a,PLATFORM,m),mkTc(src,m,ata(PLATFORM,m).toBase58(),W.a,u,d));
 const signed=await P.signTransaction(tx),sig=await conn.sendRawTransaction(signed.serialize());
 await conn.confirmTransaction({signature:sig,blockhash,lastValidBlockHeight},'confirmed');
 return sig;
}
async function payoutTok(to,n){
 const S=solanaWeb3,conn=new S.Connection(RPC,'confirmed'),kp=S.Keypair.fromSecretKey(b58d(PKEY)),m=TOK.m,d=TOK.d;
 return S.sendAndConfirmTransaction(conn,new S.Transaction().add(mkAta(PLATFORM,to,m),mkTc(ata(PLATFORM,m).toBase58(),m,ata(to,m).toBase58(),PLATFORM,BigInt(n)*10n**BigInt(d),d)),[kp]);
}
async function sendSol(lam){
 const sw=window.solanaWeb3,conn=new sw.Connection(RPC,'confirmed'),from=new sw.PublicKey(W.a),to=new sw.PublicKey(PLATFORM);
 if(await conn.getBalance(from)<lam+10000)throw new Error('low');
 const {blockhash,lastValidBlockHeight}=await conn.getLatestBlockhash();
 const tx=new sw.Transaction({feePayer:from,blockhash,lastValidBlockHeight}).add(sw.SystemProgram.transfer({fromPubkey:from,toPubkey:to,lamports:lam}));
 const signed=await P.signTransaction(tx);
 const sig=await conn.sendRawTransaction(signed.serialize());
 await conn.confirmTransaction({signature:sig,blockhash,lastValidBlockHeight},'confirmed');
 return sig;
}
async function pay(id){
 const c=crs(id),v=k=>$('#i'+k).value.trim(),cr=pm!=='card',tk=pm==='tok',n=Math.ceil(c.p/RATE);
 const ok=[v(1).split(/\s+/).filter(Boolean).length>=2&&v(1).length>=5,/^\+?[\d\s()-]{10,16}$/.test(v(2)),/^[\w.+-]+@gmail\.com$/i.test(v(3)),cr||v(4).replace(/\s/g,'').length===16];
 ok.forEach((g,i)=>$('#f'+(i+1)).classList.toggle('bad',!g));
 if(ok.includes(false)){$('#er').textContent=t('err');return}
 let tx='';
 if(cr){
  if(!W){$('#er').textContent=t('wneed');return}
  if(tk&&!TOK){$('#er').textContent=t('tknone');return}
  if(!window.solanaWeb3){$('#er').textContent=t('wnet');return}
  const b=$('#pb2');b.disabled=true;
  try{tx=tk?await sendTok(n):await sendSol(Math.round(c.p/80000*1e9))}
  catch(e){b.disabled=false;$('#er').textContent=errM(e);return}
 }
 O.push({id:Date.now(),c:id,p:c.p,s:'e',name:v(1),phone:v(2),mail:v(3),m:pm,sol:pm==='sol'?solAmt(c.p):'',tk:tk?n:0,mint:tk?TOK.m:'',tx,live:cr?1:0});sv('o',O);
 showM(`<h2 class="ok">✓ ${t('paid')}</h2>${tx?`<p class="mute" style="word-break:break-all">${tk?'🪙 '+n+' '+t('tokw'):'◎ '+solAmt(c.p)+' SOL'}<br>${t('tx')}: ${tx.slice(0,12)}…${tx.slice(-8)}<br>${t('wnote2')}</p><p><a href="https://explorer.solana.com/tx/${tx}?cluster=devnet" target="_blank" rel="noopener">${t('wex')}</a></p>`:''}<p class="mute">${t('sn')}</p><button class="btn" onclick="closeM();go('m')">${t('nm')}</button>`);head();
}
T.push(...ld('xt',[]));C.push(...ld('xc',[]));
let US=ld('u',[]),U=US.find(x=>x.id===ld('cu',0))||null,am='r';
const saveX=()=>{sv('xt',T.filter(x=>x.id>1000));sv('xc',C.filter(x=>x.id>1000));sv('u',US)};
function vA(){
 $('#app').innerHTML=`<div style="max-width:440px;margin:48px auto 64px"><div class="chips"><button class="chip ${am==='r'?'on':''}" onclick="am='r';vA()">${t('rg')}</button><button class="chip ${am==='l'?'on':''}" onclick="am='l';vA()">${t('li')}</button></div>
 <div class="card" style="gap:0">
 <div class="f" id="a1"><label for="c1">${t('ct')}</label><input id="c1" type="text" autocomplete="username" placeholder="name@gmail.com / +7 701 000 00 00"></div>
 ${am==='r'?`<div class="f" id="a2"><label for="c2">${t('nk')}</label><input id="c2" type="text" maxlength="20" autocomplete="nickname"></div>
 <div class="f"><label>${t('rl')}</label><div class="row"><label class="chip"><input type="radio" name="rl" value="s" checked>${t('st')}</label><label class="chip"><input type="radio" name="rl" value="t">${t('tc')}</label></div></div>`:''}
 <div class="mute" id="ae" style="color:#e5484d;min-height:22px"></div>
 <button class="btn" onclick="auth()">${am==='r'?t('rg'):t('li')}</button>
 <p class="mute" style="font-size:13px;margin-bottom:0">🔒 ${t('dm')}</p></div></div>`}
function auth(){
 const c=$('#c1').value.trim(),em=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c),ph=/^\+?[\d\s()-]{10,16}$/.test(c);
 $('#a1').classList.toggle('bad',!em&&!ph);
 if(!em&&!ph){$('#ae').textContent=t('ce');return}
 const key=em?c.toLowerCase():c.replace(/[^\d+]/g,'');
 let u=US.find(x=>x.k===key);
 if(!u){
  let nk=am==='r'?$('#c2').value.trim():(c.split('@')[0]||'user').slice(0,20),r='s';
  if(am==='r'){$('#a2').classList.toggle('bad',nk.length<3);if(nk.length<3){$('#ae').textContent=t('ne');return}r=document.querySelector('input[name=rl]:checked').value}
  u={id:Date.now(),k:key,c,nk,r,ab:'',sk:''};US.push(u);
  if(r==='t')T.push({id:u.id,n:nk,r:0,n0:0,y:0,e:'—',s:[],l:[lang],b:['','','']});
  saveX();
 }
 U=u;sv('cu',u.id);go('p');
}
function logout(){U=null;sv('cu',0);go('c')}
function vP(){
 if(!U){go('a');return}
 const tr=U.r==='t',x=tr&&tch(U.id),mine=tr?C.filter(c=>c.t===U.id):[];
 $('#app').innerHTML=`<div style="max-width:620px;margin:40px auto 64px;display:flex;flex-direction:column;gap:18px">
 <div class="row">${av({id:U.id%97,n:U.nk},1)}<div><h1 style="font-size:28px;margin:0">${t('hi')}, ${esc(U.nk)}!</h1><div class="mute">${esc(U.c)} <span class="tag">${tr?t('tc'):t('st')}</span></div></div></div>
 <div class="row" style="flex-wrap:wrap"><button class="btn" onclick="go('${tr?'t':'c'}')">${t('nc')}</button><button class="btn g" onclick="go('m')">${t('nm')}</button><button class="btn bad" onclick="logout()">${t('lo')}</button></div>
 ${tr?`<div class="card"><h3>${t('prof')}</h3>
  <div class="f"><label for="pa">${t('ab')}</label><textarea id="pa" maxlength="400">${esc(U.ab)}</textarea></div>
  <div class="f"><label for="pe">${t('ey')}</label><input id="pe" type="number" min="0" max="60" value="${x.y}"></div>
  <div class="f"><label for="pd">${t('ed')}</label><input id="pd" type="text" maxlength="80" value="${esc(x.e==='—'?'':x.e)}"></div>
  <div class="f"><label for="pw">${t('wlt')}</label><input id="pw" type="text" maxlength="44" value="${esc(x.w||'')}" placeholder="Phantom (Devnet) address"></div>
  <div class="f"><label for="ps">${t('skl')}</label><input id="ps" type="text" maxlength="80" value="${esc(U.sk)}"></div>
  <div class="row" style="flex-wrap:wrap"><button class="btn" onclick="saveP()">${t('svr')}</button><button class="btn g" onclick="saveP(1)">${t('pv')}</button><span class="ok" id="sm"></span></div></div>
 <div class="card"><h3>${t('ac')}</h3>
  <div class="f" id="g1"><label for="cn">${t('ctt')}</label><input id="cn" type="text" maxlength="60"></div>
  <div class="f"><label for="cdd">${t('cd')}</label><textarea id="cdd" maxlength="300"></textarea></div>
  <div class="f"><label for="cg">${t('cg')}</label><select id="cg">${CATS.slice(1).map(k=>`<option value="${k}">${t(k)}</option>`).join('')}</select></div>
  <div class="f"><label for="cl">${t('tl')}</label><select id="cl">${['ru','kk','en'].map(k=>`<option value="${k}" ${k===lang?'selected':''}>${LN[k]}</option>`).join('')}</select></div>
  <div class="f" id="g2"><label for="cpr">${t('cp')}</label><input id="cpr" type="number" min="500" max="10000" step="100" value="3000"></div>
  <div class="mute" id="ce2" style="color:#e5484d"></div>
  <button class="btn" onclick="addC()">${t('pub')}</button></div>
 <h2 style="margin:0">${t('mc')}</h2>${mine.map(c=>`<div class="card"><b>${esc(c.n[IDX[lang]])}</b><span class="mute">${money(c.p)} · ${t(c.c)} · ${c.l.map(k=>LN[k]).join(', ')}</span><div class="row"><button class="btn g" onclick="openC(${c.id})">${t('nc')}</button><button class="btn bad" onclick="delC(${c.id})">${t('del')}</button></div></div>`).join('')}`:''}
 </div>`}
function saveP(pv){
 const w=$('#pw').value.trim();
 if(w&&!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(w)){$('#sm').textContent=t('wbad');return}
 U.ab=$('#pa').value.trim();U.sk=$('#ps').value.trim();
 const x=tch(U.id);x.w=w;x.b=[U.ab,U.ab,U.ab];x.s=U.sk.split(',').map(z=>z.trim()).filter(Boolean).slice(0,6);
 x.y=Math.max(0,Math.min(60,+$('#pe').value||0));x.e=$('#pd').value.trim()||'—';
 saveX();$('#sm').textContent='✓ '+t('sd');if(pv)openT(U.id);
}
function addC(){
 const n=$('#cn').value.trim(),p=+$('#cpr').value,l=$('#cl').value,ok=p>=500&&p<=10000;
 $('#g1').classList.toggle('bad',n.length<3);$('#g2').classList.toggle('bad',!ok);
 if(n.length<3||!ok){$('#ce2').textContent=t('err');return}
 const c={id:Date.now(),c:$('#cg').value,t:U.id,p:Math.round(p),l:[l],d:$('#cdd').value.trim(),n:[n,n,n]};
 C.push(c);const x=tch(U.id);if(!x.l.includes(l))x.l.push(l);
 saveX();vP();
 showM(`<h2 class="ok">✓ ${t('pubd')}</h2><p><b>${esc(n)}</b><br><span class="mute">${money(c.p)} · ${t(c.c)} · ${LN[l]}</span></p><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="cat='${c.c}';tl='all';price=10000;closeM();go('c')">${t('see')}</button><button class="btn g" onclick="closeM()">${t('cl')}</button></div>`);
}
function delC(id){const i=C.findIndex(c=>c.id===id);if(i>-1&&C[i].t===U.id&&id>1000){C.splice(i,1);saveX();vP()}}
render();
</script>
